<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var base = "/handecor";
        var path = window.location.pathname || base;
        var normalized = path.startsWith(base)
          ? path.slice(base.length)
          : path;
        var trimmed = normalized.replace(/^\/+/, "");
        var hashPath = trimmed ? "#/" + trimmed : "#/";
        window.location.replace(base + "/" + hashPath);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/handecor/#/" />
    </noscript>
    <p>Redirecting to Cartzio Handmade...</p>
  </body>
</html>
